<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Fonts: preconnect + load in <head> (not via CSS @import) so headings
         (Playfair Display) and body (Inter) arrive fast and render the same on
         desktop and mobile, avoiding a flash of fallback serif on slow loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="/assets/tke-crest.png" />
    <link rel="apple-touch-icon" href="/assets/tke-crest.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#AD2624" />
    <meta
      name="description"
      content="Tau Kappa Epsilon — Epsilon Alpha Chapter at Saint Louis University. Building Better Men since 1955. Proud partners of St. Jude Children's Research Hospital."
    />

    <link rel="canonical" href="https://www.tkeslu.org/" />

    <!-- Open Graph / social sharing (absolute URLs so crawlers can fetch them) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TKE Epsilon Alpha" />
    <meta property="og:url" content="https://www.tkeslu.org/" />
    <meta property="og:title" content="TKE at SLU — Tau Kappa Epsilon, Epsilon Alpha Chapter" />
    <meta
      property="og:description"
      content="Building Better Men since 1955. Proud partners of St. Jude Children's Research Hospital."
    />
    <meta property="og:image" content="https://www.tkeslu.org/assets/tke-lockup-dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TKE at SLU — Tau Kappa Epsilon, Epsilon Alpha Chapter" />
    <meta
      name="twitter:description"
      content="Building Better Men since 1955. Proud partners of St. Jude Children's Research Hospital."
    />
    <meta name="twitter:image" content="https://www.tkeslu.org/assets/tke-lockup-dark.png" />

    <link rel="manifest" href="/manifest.json" />
    <title>TKE at SLU</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
